<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compra Confirmada! - RAVENGAMES</title>
  <link rel="icon" type="image/png" href="../favicon.png" />
  <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon" />
  <link rel="apple-touch-icon" href="../favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #07090e;
      --bg-card: rgba(18, 24, 38, 0.75);
      --border-color: rgba(255, 255, 255, 0.08);
      --primary: #00d2ff;
      --secondary: #9d4edd;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-green: #10b981;
      --accent-green-glow: rgba(16, 185, 129, 0.35);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    html, body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 20px;
    }

    /* Glows de Fundo */
    .ambient-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(650px, 90vw);
      height: 420px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.18) 0%, rgba(0, 210, 255, 0.12) 45%, transparent 75%);
      filter: blur(90px);
      z-index: 0;
      pointer-events: none;
    }

    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 70%, transparent 100%);
      z-index: 0;
      pointer-events: none;
    }

    /* Card Central */
    .thank-card {
      position: relative;
      z-index: 1;
      background: var(--bg-card);
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 28px;
      padding: 3.5rem 2.5rem;
      max-width: 560px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 45px rgba(16, 185, 129, 0.15);
    }

    .thank-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 15%;
      right: 15%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #10b981, #00d2ff, transparent);
    }

    /* Logo no topo do Card */
    .brand-logo {
      width: 52px;
      height: 52px;
      object-fit: cover;
      border-radius: 14px;
      filter: drop-shadow(0 0 16px rgba(0, 210, 255, 0.45));
      display: block;
      margin: 0 auto 1.5rem;
    }

    /* Ícone Animado de Sucesso */
    .success-icon-wrap {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.12);
      border: 2px solid rgba(16, 185, 129, 0.5);
      color: var(--accent-green);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      box-shadow: 0 0 35px var(--accent-green-glow);
      animation: pulseGreen 2.4s infinite ease-in-out;
    }

    @keyframes pulseGreen {
      0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(16, 185, 129, 0.3); }
      50% { transform: scale(1.06); box-shadow: 0 0 45px rgba(16, 185, 129, 0.6); }
    }

    /* Badge */
    .badge-success {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34d399;
      padding: 0.4rem 1rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 1.2rem;
    }

    .badge-success .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    .title-success {
      font-size: clamp(1.8rem, 4.5vw, 2.3rem);
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.8px;
      line-height: 1.15;
      margin-bottom: 1rem;
    }

    .title-success span {
      background: linear-gradient(135deg, #10b981, #00d2ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Mensagem Central com Destaque */
    .msg-box {
      background: rgba(0, 210, 255, 0.06);
      border: 1px dashed rgba(0, 210, 255, 0.35);
      border-radius: 18px;
      padding: 1.5rem 1.2rem;
      margin-top: 1.5rem;
    }

    .msg-main {
      font-size: 1.15rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.45;
      margin-bottom: 0.6rem;
    }

    .msg-main strong {
      color: #00d2ff;
    }

    .msg-sub {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.55;
    }

    @media (max-width: 480px) {
      .thank-card {
        padding: 2.5rem 1.5rem;
      }
      .title-success {
        font-size: 1.65rem;
      }
      .msg-main {
        font-size: 1.05rem;
      }
    }
  </style>
</head>
